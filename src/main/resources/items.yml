# Standard-Items. Wird beim ersten Start nach plugins/ACI/items.yml kopiert.
# Alles hier kann auch bequem im Spiel ueber /aci bearbeitet werden.
#
# effects:
#   type:    Name des Effekts (z.B. SPEED, STRENGTH, FIRE_RESISTANCE)
#   level:   1 = Stufe I, 2 = Stufe II, ...
#   slot:    MAIN_HAND, OFF_HAND, HELMET, CHESTPLATE, LEGGINGS, BOOTS, ANYWHERE
#   seconds: 0 = nur solange das Item im Slot ist (staendig erneuert)
#            >0 = Effekt mit dieser Laenge (z.B. 480 = 8 Minuten), wird erneuert solange das Item im Slot ist
